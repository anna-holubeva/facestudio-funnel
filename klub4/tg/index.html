<!-- Повтор эфира 31.10/01.11 (30.10). До END — сразу в чат, после — «Запись закрыта».
     Собрано: запуск-октябрь-2026/повтор-klub4/собрать-переходники.py. Откат: git checkout d6897b5 -- klub4/ -->
<script>
(function(){var U='https://club.facestudio.by/anketa/pv',q=new URLSearchParams(location.search);
function send(ev,t){try{var d=JSON.stringify({ev:ev,t:t||'',h:location.hostname,p:location.pathname,r:document.referrer,
us:q.get('utm_source')||q.get('u')||'',um:q.get('utm_medium')||'',uc:q.get('utm_campaign')||'',cid:q.get('cid')||'',
src:q.get('p')||q.get('ct')||'',w:screen.width});
if(!(navigator.sendBeacon&&navigator.sendBeacon(U,new Blob([d],{type:'text/plain'}))))
fetch(U,{method:'POST',body:d,keepalive:true,mode:'no-cors'})}catch(e){}}
send('view');
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('.btn,[data-cta]');if(!b)return;
send('click',(b.getAttribute('data-cta')||'btn')+'@1')},true);
// конец записи на повтор: вс 01.11 09:20 по Мск (06:20 UTC), чтение TG-5 в 09:30
var END=Date.UTC(2026,10,1,6,20),u=(q.get('utm_source')||q.get('u')||'').replace(/[^\w-]/g,'').slice(0,40);
window.OPEN=Date.now()<END;
if(OPEN)location.replace('https://telegram.me/facestudio_club_bot?start=club4_tg');
})();
</script>

<style>

*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
     font-family:'Golos Text','Segoe UI',system-ui,sans-serif;font-size:17px;line-height:1.6;padding:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;

    <a class="btn" href="https://facestudio.by/" data-cta="club">Условия клуба</a>
  </div>
<script>
